name: Update PSX calendar

# Runs the full pipeline on a schedule, then publishes the result to
# GitHub Pages. Also runnable manually (workflow_dispatch) for testing
# without waiting for the schedule.
#
# IMPORTANT DESIGN NOTE: GitHub Actions runners are ephemeral -- each run
# starts from a fresh checkout with no memory of previous runs. Every
# enrichment script's caching (meeting_dates_cache.json, sentiment_cache.
# json, etc.) only helps if those cache files actually persist BETWEEN
# runs. This workflow does that by keeping all generated state (cache
# files, events_merged.json, the published site) on a separate `gh-pages`
# branch that persists via git itself -- not GitHub's actions/cache
# feature, which is designed for immutable build-dependency caching, not
# accumulating state that grows across runs. Each run restores the
# previous run's cache files from gh-pages, runs the pipeline (which then
# only processes genuinely new events), and commits the updated state back.
#
# SETUP REQUIRED before this will work:
#   1. Repo Settings > Secrets and variables > Actions > New repository
#      secret. Add GEMINI_API_KEY and LOGO_DEV_TOKEN (same keys used
#      locally). Skip either one and this workflow gracefully skips that
#      enrichment step, same as running run_pipeline.py locally without it.
#   2. Repo Settings > Pages > Source > set to "Deploy from a branch",
#      branch "gh-pages", folder "/ (root)". This won't have anything to
#      select until this workflow has run at least once and created that
#      branch.
#   3. First run: use the "Run workflow" button (Actions tab) to trigger
#      it manually rather than waiting for the schedule, so you can watch
#      it and catch anything that needs adjusting.
#
# NOT TESTED END-TO-END: I can validate this YAML's syntax and reason
# through the logic, but I can't actually execute a GitHub Actions run
# myself. The first real trigger is the actual test -- same as every other
# "can't run this from my sandbox" situation in this project (the meeting-
# date OCR, the Gemini model swap). Watch the Actions tab's log on that
# first run before trusting it to run unattended on schedule.

on:
  schedule:
    # 18:00 UTC daily = 23:00 PKT -- after PSX market close and most same-day
    # announcement filings. Arbitrary reasonable default, easy to change.
    - cron: '0 18 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source (main branch)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore previous run's cache files from gh-pages
        continue-on-error: true  # fine if gh-pages doesn't exist yet (first-ever run)
        run: |
          git fetch origin gh-pages || exit 0
          git show origin/gh-pages:meeting_dates_cache.json > meeting_dates_cache.json 2>/dev/null || true
          git show origin/gh-pages:sentiment_cache.json > sentiment_cache.json 2>/dev/null || true
          git show origin/gh-pages:company_domains_cache.json > company_domains_cache.json 2>/dev/null || true
          git show origin/gh-pages:eps_data_cache.json > eps_data_cache.json 2>/dev/null || true
          git show origin/gh-pages:kmi_compliance_cache.json > kmi_compliance_cache.json 2>/dev/null || true

      - name: Run the pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LOGO_DEV_TOKEN: ${{ secrets.LOGO_DEV_TOKEN }}
        run: python run_pipeline.py

      - name: Prepare publish directory
        run: |
          mkdir -p _site
          cp events_merged.json _site/
          cp ui/timeline.html _site/index.html
          # cache files travel with the publish so the NEXT run can restore
          # them in the step above -- gh-pages is both "published site" and
          # "pipeline state storage" in this design
          cp meeting_dates_cache.json _site/ 2>/dev/null || true
          cp sentiment_cache.json _site/ 2>/dev/null || true
          cp company_domains_cache.json _site/ 2>/dev/null || true
          cp eps_data_cache.json _site/ 2>/dev/null || true
          cp kmi_compliance_cache.json _site/ 2>/dev/null || true

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
